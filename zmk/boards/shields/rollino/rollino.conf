CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_INPUT_PMW3610=y

# battery level over BLE
CONFIG_ZMK_BATTERY_REPORTING=y

# No deep sleep: nothing would wake it without buttons (the sensors' motion
# pins aren't wired up as wakeup sources yet). The sensors drop into their
# own rest modes when the ball stops.
CONFIG_ZMK_SLEEP=n
