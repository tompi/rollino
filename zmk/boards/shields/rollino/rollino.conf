CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_INPUT_PMW3610=y

# battery level over BLE
CONFIG_ZMK_BATTERY_REPORTING=y

# full transmit power: the XIAO's antenna is close to the base PCB and the
# table (the battery is at the back of the case, away from it)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# No deep sleep: nothing would wake it without buttons (the sensors' motion
# pins aren't wired up as wakeup sources yet). The sensors drop into their
# own rest modes when the ball stops.
CONFIG_ZMK_SLEEP=n

# three Bluetooth profiles (hosts) rather than five: with no buttons, a
# wiggle of the ball steps through them (see ball_fusion.c), and three is
# fewer to step round
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_MAX_CONN=3
